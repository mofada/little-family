
name: little-family

services:
  api:
    build:
      context: ./source
      dockerfile: apps/api/Dockerfile

    restart: unless-stopped

    ports:
      - "127.0.0.1:3002:3000"

    env_file:
      - ./api.env

    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_PATH: /repo/apps/api/data/little-family.db
      SESSION_DAYS: "30"
      ALLOW_DEV_LOGIN: "false"

    volumes:
      - ./data:/repo/apps/api/data

    # Keep API private to the project. Sharing the generic "api" service
    # name on gateway-net can route another project's requests here.
    networks:
      default:
        aliases:
          - little-family-api

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ./source
      dockerfile: apps/web/Dockerfile

    restart: unless-stopped

    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro

    # The public Gateway talks only to web; web reaches API privately.
    networks:
      default: {}
      gateway:
        aliases:
          - little-family-web

    depends_on:
      api:
        condition: service_healthy

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  gateway:
    external: true
    name: gateway-net
